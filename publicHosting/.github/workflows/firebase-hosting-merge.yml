name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - deploy # Or 'master' if that's your main branch name

permissions:
  contents: read
  pull-requests: write
  id-token: write # Required for OIDC authentication with Firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use a stable Node.js version, like 18 or 20
          cache: 'npm' # Cache npm dependencies for faster builds
      - name: Install dependencies
        run: npm install
      - name: Build HTML with Firebase Config
        run: npm run build
        env: # Pass Firebase config as environment variables to the build step
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          # IMPORTANT: Ensure your .env variables in build.js match these names
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}' # Not strictly needed here, but good practice
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALS_PLANNER_B547D }}' # Make sure this secret exists and is correct
          channelId: live # Deploys to your live site URL
          projectId: meals-planner-b547d # Your Firebase Project ID
